name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Lint debug build
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble instrumentation test APK
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble unsigned release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build unsigned release app bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify release app bundle structure
        run: bash scripts/verify-release-bundle.sh

      - name: Verify release APK metadata
        run: bash scripts/verify-release-apk.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myeca-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: myeca-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release app bundle
        uses: actions/upload-artifact@v4
        with:
          name: myeca-release-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: myeca-debug-android-test-apk
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myeca-android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/lint-results-debug.txt

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myeca-android-unit-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/

      - name: Upload release metadata reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myeca-android-release-metadata
          path: |
            android/app/build/reports/apk-metadata/
            android/app/build/reports/bundle-metadata/
