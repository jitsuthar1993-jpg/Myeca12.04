    <style>body{font-family:'Inter',system-ui,-apple-system,sans-serif}</style>

    <!-- Inline skeleton shimmer animation -->
    <style>
      @keyframes skel{0%{background-position:-200% 0}100%{background-position:200% 0}}
      .skel{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:skel 1.5s infinite}
      @media(prefers-reduced-motion:reduce){.skel{animation:none}}
    </style>
    <style>
      .static-seo-shell{min-height:100vh;background:#fff;color:#0f172a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:40px 16px 56px}
      .static-seo-shell section{max-width:880px;margin:0 auto}
      .static-seo-eyebrow,.static-seo-meta{display:inline-flex;margin:0 0 16px;border:1px solid #dbeafe;border-radius:8px;background:#eff6ff;color:#1d4ed8;padding:6px 10px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
      .static-seo-shell h1{max-width:820px;margin:0;color:#020617;font-size:clamp(34px,8vw,60px);font-weight:900;line-height:1.04}
      .static-seo-shell p:not(.static-seo-eyebrow):not(.static-seo-meta){max-width:760px;margin:18px 0 0;color:#475569;font-size:17px;line-height:1.7}
      .static-seo-shell ul{max-width:880px;margin:28px auto 0;padding:0;display:grid;gap:10px;list-style:none}
      .static-seo-shell li{border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;color:#334155;font-size:14px;font-weight:700}
      .static-seo-shell article{max-width:880px;margin:28px auto 0;color:#334155}
      @media(min-width:700px){.static-seo-shell{padding:72px 32px}.static-seo-shell ul{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>

          <img src="/icons/icon-192.png" alt="" width="72" height="72" style="width:72px;height:72px;border-radius:18px;margin:0 auto 18px;box-shadow:0 18px 40px rgba(37,99,235,.18)" />

          <div style="display:grid;gap:10px;margin:26px auto 0;max-width:280px">
            <div class="skel" style="height:10px;border-radius:999px"></div>
